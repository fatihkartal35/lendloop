services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7
    ports:
      - "5678:5678"
    env_file: .env.n8n.local # LENDLOOP_SHARED_SECRET lives here, never in workflow JSON
    environment:
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-http://host.docker.internal:3211}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # Code nodes read the secret from $env
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  n8n_data:
